<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feliz Día de las Flores Amarillas</title>

    <style>
        :root {
            --amarillo-principal: #ffd700;
            --amarillo-oscuro: #b38600;
            --amarillo-suave: #fff9e6;
            --amarillo-fondo: #ffe680;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(
                to bottom,
                var(--amarillo-suave),
                var(--amarillo-fondo)
            );
        }

        /* Contenedor de las flores cayendo */
        #flor-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        /* Tarjeta principal */
        .tarjeta {
            position: relative;
            z-index: 10;
            width: min(100%, 500px);
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            border: 2px solid var(--amarillo-principal);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(230, 180, 0, 0.25);
            backdrop-filter: blur(8px);
            animation: aparecer 1.5s ease-out both;
        }

        .icono-principal {
            margin-bottom: 10px;
            font-size: 3.5rem;
            line-height: 1;
            animation: latido 2s ease-in-out infinite;
        }

        h1 {
            margin: 0 0 15px;
            color: var(--amarillo-oscuro);
            font-size: clamp(1.8rem, 5vw, 2.2rem);
            font-weight: 700;
        }

        p {
            margin: 0 0 25px;
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .dedicatoria {
            margin-bottom: 0;
            color: #cc9900;
            font-style: italic;
            font-weight: 600;
        }

        /* Flores y elementos decorativos */
        .flor-cayendo {
            position: absolute;
            top: -60px;
            left: 0;
            user-select: none;
            font-size: var(--tamano, 24px);
            animation-name: caer;
            animation-duration: var(--duracion, 6s);
            animation-delay: var(--retraso, 0s);
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes caer {
            0% {
                transform: translate3d(0, -60px, 0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translate3d(var(--movimiento, 0px), 110vh, 0)
                    rotate(360deg);
                opacity: 0.25;
            }
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes latido {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        /* Respeta la configuración del usuario para reducir animaciones */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }

            .flor-cayendo {
                display: none;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .tarjeta {
                padding: 30px 20px;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div id="flor-container" aria-hidden="true"></div>

    <main class="tarjeta">
        <div class="icono-principal" aria-hidden="true">🌻</div>

        <h1>Para Alguien Especial</h1>

        <p>
            Hoy el cielo y la tierra se visten de dorado para celebrar la
            alegría, el amor y los momentos compartidos. Que estas flores
            amarillas iluminen tu día tanto como tu sonrisa ilumina la vida de
            quienes te rodean.
        </p>

        <p class="dedicatoria">
            ¡Feliz Día de las Flores Amarillas! 💛
        </p>
    </main>

    <script>
        "use strict";

        const container = document.getElementById("flor-container");

        const emojisFlores = ["🌻", "🌼", "💛", "🌸", "✨"];
        const numeroFlores = 50;

        function numeroAleatorio(minimo, maximo) {
            return Math.random() * (maximo - minimo) + minimo;
        }

        function crearFlor() {
            const flor = document.createElement("span");

            const tamano = numeroAleatorio(15, 30);
            const duracion = numeroAleatorio(4, 8);
            const retraso = numeroAleatorio(0, 5);
            const movimiento = numeroAleatorio(-80, 80);
            const posicionHorizontal = numeroAleatorio(0, 100);

            flor.className = "flor-cayendo";
            flor.textContent =
                emojisFlores[
                    Math.floor(Math.random() * emojisFlores.length)
                ];

            flor.style.left = `${posicionHorizontal}vw`;
            flor.style.setProperty("--tamano", `${tamano}px`);
            flor.style.setProperty("--duracion", `${duracion}s`);
            flor.style.setProperty("--retraso", `${retraso}s`);
            flor.style.setProperty("--movimiento", `${movimiento}px`);

            container.appendChild(flor);

            /*
             * Se elimina después de que termine la animación,
             * incluyendo el tiempo de retraso inicial.
             */
            const tiempoTotal = (duracion + retraso + 0.5) * 1000;

            setTimeout(() => {
                flor.remove();
                crearFlor();
            }, tiempoTotal);
        }

        function iniciarLluviaDeFlores() {
            for (let i = 0; i < numeroFlores; i++) {
                setTimeout(crearFlor, i * 150);
            }
        }

        iniciarLluviaDeFlores();
    </script>
</body>
</html>
